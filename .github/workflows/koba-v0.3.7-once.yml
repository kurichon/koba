name: Publish KoBa v0.3.7 and retire prebrand artifacts (one-time)

on:
  push:
    branches: [main]
    paths: [.github/workflows/koba-v0.3.7-once.yml]

permissions:
  contents: read

concurrency:
  group: koba-v0.3.7-retirement
  cancel-in-progress: false

jobs:
  qualify-publish-and-retire:
    if: >-
      github.repository == 'kurichon/koba' &&
      startsWith(github.event.head_commit.message, 'chore: release KoBa v0.3.7 and retire prebrand artifacts')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and build the exact candidate
        run: |
          npm ci
          npm run build -- --tag v0.3.7
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          archive = pathlib.Path('dist/KoBa_v0.3.7.zip')
          expected = '493a5a633839e3e3432619e106c9e17d4cc8a83cf285cabb3aa86452a6ac729d'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Candidate ZIP differs from the reviewed v0.3.7 bytes')
          if pathlib.Path('dist/SHA256SUMS.txt').read_text() != expected + '  KoBa_v0.3.7.zip\n':
              raise SystemExit('Expected one canonical checksum entry')
          with zipfile.ZipFile(archive) as package:
              package.extractall(pathlib.Path(os.environ['RUNNER_TEMP']) / 'koba-v0.3.7')
          print('Reviewed v0.3.7 ZIP verified and extracted.')
          PY
      - name: Run state and update tests
        run: npm test
      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise the extracted release ZIP in Chromium
        env:
          JPDB_TEST_EXTENSION: ${{ runner.temp }}/koba-v0.3.7
          JPDB_TEST_OUTPUT: ${{ runner.temp }}/koba-v0.3.7-evidence
        run: |
          xvfb-run -a npm run test:browser
          python3 - <<'PY'
          import json, os, pathlib
          report = json.loads((pathlib.Path(os.environ['JPDB_TEST_OUTPUT']) / 'browser-results.json').read_text())
          if report['candidate'] != '0.3.7' or len(report['results']) != 8:
              raise SystemExit('Expected all eight v0.3.7 browser scenarios')
          if any(item['status'] != 'passed' for item in report['results']):
              raise SystemExit('A packaged-extension browser scenario failed')
          print('All eight packaged-extension browser scenarios passed.')
          PY
      - name: Publish the verified package and retire exact obsolete targets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kurichon/koba
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, tempfile

          REPO = 'kurichon/koba'
          TAG = 'v0.3.7'
          ZIP_NAME = 'KoBa_v0.3.7.zip'
          ZIP_HASH = '493a5a633839e3e3432619e106c9e17d4cc8a83cf285cabb3aa86452a6ac729d'
          COMMIT = os.environ['GITHUB_SHA']
          NOTES = """## KoBa v0.3.7 — one package, current support

          - Publish one KoBa ZIP and its SHA-256 checksum.
          - Accept only the KoBa package name for update discovery.
          - Retire pre-KoBa compatibility handlers, fixtures, documentation and duplicate release packages.
          - Preserve current KoBa review, recovery, settings and browser-local API-key storage.

          **Update:** Download KoBa_v0.3.7.zip, replace the files in the same unpacked extension folder, reload KoBa in Chrome/Brave, and refresh ChatGPT. Keep the existing extension installation to preserve browser-local settings.

          **Verification:** State/update checks, eight actual-extension Chromium scenarios against the extracted ZIP, and SHA-256 validation passed. Tests used simulated JPDB/GitHub transport; they did not access a live JPDB account. The live-browser long-idle symptom remains tracked in issue #6.
          """
          OLD = [
              dict(tag='v0.3.5', release=421506587, canonical=668168013, alias=668168012, sums=668168015,
                   size=37033, digest='1b83d8d5b5c304528cec64aea11843646e39b13e330f8e7acb60102eaab8afc6',
                   old_sums='0f1e395edf0949f5c2c548c635ae9ae4f1537ad95e28e25370d4663d5623b808'),
              dict(tag='v0.3.6', release=421575201, canonical=668391418, alias=668391417, sums=668391419,
                   size=39005, digest='180948881f3159826969d92102cd81f3f9253ff6f1733fe8f371af4261f656d3',
                   old_sums='29882d45066745a7d306626872948e2531be0b594e0f05b7bf4dcb21a3bc67ca'),
          ]
          DRAFT_ID = 421446187
          DRAFT_ASSETS = {
              'KoBa_v0.3.3.zip': (667939657, 34256, '6b1731d5db8c8e5c9066eb4c08729d6c1c36d902989ba05e39fbaba280aad2a0'),
              'JPDB_Review_Button_for_ChatGPT_v0.3.3.zip': (667939660, 34256, '6b1731d5db8c8e5c9066eb4c08729d6c1c36d902989ba05e39fbaba280aad2a0'),
              'SHA256SUMS.txt': (667939662, 190, '91607bff027aa37f4d336dc2cb5e9205deca836087ac20ab55c1d3ee7c38e277'),
          }

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def api(endpoint, method='GET', payload=None, missing=False):
              command = ['gh', 'api', '--hostname', 'github.com', '--include', '--method', method,
                         f'repos/{REPO}/{endpoint}']
              if payload is not None:
                  command += ['--input', '-']
              result = subprocess.run(command, input=json.dumps(payload) if payload is not None else None,
                                      text=True, capture_output=True, timeout=60)
              header, separator, body = result.stdout.replace('\r\n', '\n').partition('\n\n')
              match = re.match(r'HTTP/\S+ (\d{3})', header)
              require(separator and match, f'{method} {endpoint}: no HTTP response')
              status = int(match[1])
              if missing and status == 404:
                  return None
              expected = 204 if method == 'DELETE' else 201 if method == 'POST' else 200
              require(result.returncode == 0 and status == expected,
                      f'{method} {endpoint}: unexpected HTTP {status}')
              return json.loads(body) if body.strip() else None

          def assets(release):
              rows = release.get('assets', [])
              result = {item['name']: item for item in rows}
              require(len(result) == len(rows), 'Duplicate asset names in a targeted release')
              return result

          def check_asset(asset, name, size, digest, asset_id=None):
              require(asset and asset['name'] == name and asset['state'] == 'uploaded'
                      and asset['size'] == size and asset.get('digest') == 'sha256:' + digest
                      and (asset_id is None or asset['id'] == asset_id),
                      f'Unexpected asset identity or bytes: {name}')

          def empty_upload(asset):
              # GitHub can retain a zero-byte starter after an interrupted upload.
              return (asset.get('state') == 'starter' and asset.get('size') == 0
                      and asset.get('digest') in {None, ''}
                      and isinstance(asset.get('id'), int) and asset['id'] > 0)

          def old_release(spec):
              release = api(f"releases/{spec['release']}")
              require(release['tag_name'] == spec['tag'] and release['draft'] is False
                      and release['prerelease'] is False and release.get('immutable') is False,
                      f"Unexpected published release state: {spec['tag']}")
              name = 'KoBa_' + spec['tag'] + '.zip'
              alias = 'JPDB_Review_Button_for_ChatGPT_' + spec['tag'] + '.zip'
              rows = assets(release)
              require(set(rows) <= {name, alias, 'SHA256SUMS.txt'}, 'Unexpected old release assets')
              check_asset(rows.get(name), name, spec['size'], spec['digest'], spec['canonical'])
              if alias in rows:
                  check_asset(rows[alias], alias, spec['size'], spec['digest'], spec['alias'])
              text = spec['digest'] + '  ' + name + '\n'
              digest = hashlib.sha256(text.encode()).hexdigest()
              if 'SHA256SUMS.txt' in rows:
                  sums = rows['SHA256SUMS.txt']
                  if empty_upload(sums):
                      pass  # Only this replaceable checksum may be an incomplete transfer.
                  elif sums.get('digest') == 'sha256:' + spec['old_sums']:
                      check_asset(sums, 'SHA256SUMS.txt', 190, spec['old_sums'], spec['sums'])
                  else:
                      check_asset(sums, 'SHA256SUMS.txt', len(text.encode()), digest)
              return release, rows, alias, text

          def obsolete_draft():
              release = api(f'releases/{DRAFT_ID}', missing=True)
              if release is None:
                  return None
              require(release['tag_name'] == 'v0.3.3' and release['draft'] is True
                      and release['prerelease'] is False and release.get('immutable') is False,
                      'Obsolete draft identity or state changed')
              rows = assets(release)
              require(set(rows) == set(DRAFT_ASSETS), 'Obsolete draft assets changed')
              for name, (asset_id, size, digest) in DRAFT_ASSETS.items():
                  check_asset(rows[name], name, size, digest, asset_id)
              return release

          def upload(tag, file):
              result = subprocess.run(['gh', 'release', 'upload', tag, str(file), '--repo', REPO],
                                      text=True, capture_output=True, timeout=60)
              require(result.returncode == 0, f'Upload failed: {tag}/{file.name}')

          # All destructive targets are fixed above; validate the complete set first.
          require(os.environ['GITHUB_REPOSITORY'] == REPO and re.fullmatch(r'[0-9a-f]{40}', COMMIT),
                  'Unexpected repository or commit')
          require(api('git/ref/heads/main')['object']['sha'] == COMMIT, 'main moved; review the candidate again')
          require(api('releases/latest')['tag_name'] in {'v0.3.6', TAG}, 'Latest release changed')
          original_tags = {tag: api('git/ref/tags/' + tag)['object']
                           for tag in ['v0.3.3', 'v0.3.5', 'v0.3.6']}
          for spec in OLD:
              old_release(spec)
          obsolete_draft()
          tag = api('git/ref/tags/' + TAG, missing=True)
          if tag:
              require(tag['object']['type'] == 'commit' and tag['object']['sha'] == COMMIT,
                      'v0.3.7 tag points at another candidate')
          release_list = api('releases?per_page=100')
          require(len(release_list) < 100, 'Release inventory exceeds the reviewed bound')
          matches = [item for item in release_list if item['tag_name'] == TAG]
          require(len(matches) <= 1, 'Multiple v0.3.7 releases found')
          new_release = matches[0] if matches else None
          archive = pathlib.Path('dist') / ZIP_NAME
          sums_file = pathlib.Path('dist/SHA256SUMS.txt')
          require(hashlib.sha256(archive.read_bytes()).hexdigest() == ZIP_HASH, 'Reviewed ZIP bytes changed')
          require(sums_file.read_text() == ZIP_HASH + '  ' + ZIP_NAME + '\n', 'Unexpected v0.3.7 checksums')
          new_files = {file.name: (file, file.stat().st_size, hashlib.sha256(file.read_bytes()).hexdigest())
                       for file in [archive, sums_file]}

          def check_new(release, complete=False):
              require(release['tag_name'] == TAG and release['target_commitish'] == COMMIT
                      and release['name'] == 'KoBa v0.3.7' and release['body'] == NOTES
                      and release['prerelease'] is False, 'Existing v0.3.7 release differs from the reviewed plan')
              rows = assets(release)
              require(set(rows) <= set(new_files), 'Unexpected v0.3.7 asset')
              for name, asset in rows.items():
                  if release['draft'] is True and not complete and empty_upload(asset):
                      continue
                  _, size, digest = new_files[name]
                  check_asset(asset, name, size, digest)
              if complete or release['draft'] is False:
                  require(set(rows) == set(new_files), 'Incomplete published v0.3.7 release')
              return rows

          if new_release:
              check_new(new_release)
          print('Preflight passed for the exact candidate, releases, assets and source tags.')
          if tag is None:
              api('git/refs', 'POST', {'ref': 'refs/tags/' + TAG, 'sha': COMMIT})
          if new_release is None:
              new_release = api('releases', 'POST', {
                  'tag_name': TAG, 'target_commitish': COMMIT, 'name': 'KoBa v0.3.7',
                  'body': NOTES, 'draft': True, 'prerelease': False})
          rows = check_new(new_release)
          for name, (file, _, _) in new_files.items():
              if name in rows and empty_upload(rows[name]):
                  api(f"releases/assets/{rows[name]['id']}", 'DELETE')
                  del rows[name]
              if name not in rows:
                  upload(TAG, file)
          new_release = api(f"releases/{new_release['id']}")
          check_new(new_release, complete=True)
          if new_release['draft']:
              new_release = api(f"releases/{new_release['id']}", 'PATCH',
                                {'draft': False, 'make_latest': 'true'})
          require(new_release['draft'] is False, 'v0.3.7 was not published')
          print('Published v0.3.7 with both uploaded asset digests verified.')

          with tempfile.TemporaryDirectory(prefix='koba-checksums-') as temporary:
              for spec in OLD:
                  release, rows, alias, text = old_release(spec)
                  if alias in rows:
                      api(f"releases/assets/{spec['alias']}", 'DELETE')
                  expected_sums = 'sha256:' + hashlib.sha256(text.encode()).hexdigest()
                  current_sums = rows.get('SHA256SUMS.txt')
                  if not current_sums or current_sums.get('digest') != expected_sums:
                      if current_sums:
                          api(f"releases/assets/{current_sums['id']}", 'DELETE')
                      folder = pathlib.Path(temporary) / spec['tag']
                      folder.mkdir()
                      file = folder / 'SHA256SUMS.txt'
                      file.write_text(text)
                      upload(spec['tag'], file)
                  body = release['body'].replace('both ZIP checksums', 'the KoBa ZIP checksum')
                  body = body.replace('SHA-256 checks of both release ZIPs', 'SHA-256 verification of the KoBa release ZIP')
                  if body != release['body']:
                      api(f"releases/{spec['release']}", 'PATCH', {'body': body})
                  _, final_rows, _, _ = old_release(spec)
                  require(set(final_rows) == {'KoBa_' + spec['tag'] + '.zip', 'SHA256SUMS.txt'}
                          and final_rows['SHA256SUMS.txt'].get('digest') == expected_sums,
                          'Old release cleanup did not reach its exact target')
                  print(f"{spec['tag']}: legacy alias removed, canonical ZIP preserved, checksum refreshed.")
          if obsolete_draft() is not None:
              api(f'releases/{DRAFT_ID}', 'DELETE')
          require(api(f'releases/{DRAFT_ID}', missing=True) is None, 'Obsolete draft still exists')
          for old_tag, original in original_tags.items():
              require(api('git/ref/tags/' + old_tag)['object'] == original, 'An existing source tag changed')
          final = api('releases/latest')
          require(final['id'] == new_release['id'] and final['draft'] is False, 'v0.3.7 is not latest')
          check_new(final, complete=True)
          final_releases = api('releases?per_page=100')
          require(len(final_releases) < 100 and not any(
              item['id'] == DRAFT_ID or any(
                  asset['name'].startswith('JPDB_Review_Button_for_ChatGPT_') for asset in item.get('assets', []))
              for item in final_releases), 'A prebrand release artifact remains')
          print('Complete: v0.3.7 is latest; legacy packages and obsolete draft are absent; existing KoBa ZIPs and tags are unchanged.')
          PY
