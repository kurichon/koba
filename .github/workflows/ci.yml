name: Qualify extension

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci
      - name: Run state and update tests
        run: npm test
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise the extension in Chromium
        run: xvfb-run -a npm run test:browser
      - name: Validate runtime-only release package
        run: npm run build
