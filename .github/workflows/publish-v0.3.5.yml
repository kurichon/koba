name: Publish KoBa v0.3.5 (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.3.5.yml'

permissions:
  contents: write

concurrency:
  group: koba-publish-v0.3.5
  cancel-in-progress: false

jobs:
  publish:
    if: "${{ github.event.head_commit.message == 'release: publish KoBa v0.3.5' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build exactly v0.3.5
        run: npm run build -- --tag v0.3.5
      - name: Run background and update tests
        run: npm test
      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise the actual extension in Chromium
        run: xvfb-run -a npm run test:browser
      - name: Verify ZIP checksum and qualified build identity
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          EXPECTED='1b83d8d5b5c304528cec64aea11843646e39b13e330f8e7acb60102eaab8afc6'
          ACTUAL="$(sha256sum dist/KoBa_v0.3.5.zip | awk '{print $1}')"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "ZIP differs from passing main-branch qualification" >&2
            exit 1
          fi
      - name: Create or verify v0.3.5 tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse -q --verify refs/tags/v0.3.5 >/dev/null; then
            if [[ "$(git rev-list -n 1 refs/tags/v0.3.5)" != "$GITHUB_SHA" ]]; then
              echo "Existing v0.3.5 tag points to a different commit; refusing to overwrite" >&2
              exit 1
            fi
          else
            git tag v0.3.5 "$GITHUB_SHA"
            git push origin refs/tags/v0.3.5
          fi
      - name: Publish stable GitHub Release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.3.5 >/dev/null 2>&1; then
            echo "A v0.3.5 release already exists; refusing to overwrite it" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/KOBa_RELEASE_NOTES.md" <<'EOF'
          ## KoBa v0.3.5 — smoother review sessions

          - Warm the review queue in the background before cache expiry or when eligible cards run low.
          - Continue reviewing already-eligible cached cards while refreshes are running.
          - Reuse in-flight refreshes rather than launching duplicate requests.
          - Prevent stale JPDB responses from immediately resurfacing a recently graded card.
          - Add sanitized latency diagnostics for grade responses, next-card transitions, and refreshes.
          - Preserve existing JPDB eligibility filters, API pacing, and uncertain-grade recovery.

          **Installation:** Download KoBa_v0.3.5.zip, extract its contents over the same unpacked extension folder, reload the extension in Chrome or Brave, and refresh ChatGPT. Preserve the existing extension identity to keep local settings.

          **Updates:** GitHub release checks can notify you of newer versions. Unpacked extensions still require manual installation; this is not a Chrome Web Store automatic-update package.
          
          **Qualification:** CI verifies source tests, controlled Chromium interactions, and both ZIP checksums. Your live JPDB account and exact installed browser environment were not used during CI.
          EOF
          gh release create v0.3.5             dist/KoBa_v0.3.5.zip             dist/JPDB_Review_Button_for_ChatGPT_v0.3.5.zip             dist/SHA256SUMS.txt             --verify-tag --title 'KoBa v0.3.5' --notes-file "$RUNNER_TEMP/KOBa_RELEASE_NOTES.md" --latest
