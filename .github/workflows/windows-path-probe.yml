name: KoBa Windows path identity probe
on:
  push:
    branches: [feat/appdata-installer-one-time-migration]
    paths: [tests/windows-path-identity.cjs, .github/workflows/windows-path-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install chromium
      - run: node tests/windows-path-identity.cjs
