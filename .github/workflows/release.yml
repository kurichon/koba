name: Prepare draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag matching manifest version (e.g., v0.3.3)'
        required: true
        default: 'v0.3.3'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  qualify-and-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci
      - name: Require an exact version tag and build runtime ZIP
        run: npm run build -- --tag "$RELEASE_TAG"
      - name: Run state and update tests
        run: npm test
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise the extension in Chromium
        run: xvfb-run -a npm run test:browser
      - name: Create release tag from qualified commit (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" != "$GITHUB_SHA" ]]; then
              echo "Release tag already points to a different commit" >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Create an unpublished draft with checked assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG"
          "dist/KoBa_v${RELEASE_TAG#v}.zip"
          "dist/JPDB_Review_Button_for_ChatGPT_v${RELEASE_TAG#v}.zip"
          dist/SHA256SUMS.txt
          --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
